site_name: PS Vita Porting Wiki & Knowledge Base
site_description: "Enciclopedia técnica definitiva sobre ports de Android (.so loader, FalsoJNI, vitaGL) para PlayStation Vita. Guía completa en Español e Inglés."
site_author: "PS Vita Porting Community"
site_url: "https://metalsyntax.github.io/psvita-porting-wiki/"

repo_name: "metalsyntax/psvita-porting-wiki"
repo_url: "https://github.com/metalsyntax/psvita-porting-wiki"
edit_uri: "edit/main/docs/"

theme:
  name: material
  language: en
  palette:
    # Scheme mode: Dark / Light toggle
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro / Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro / Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vitasdk
      name: VitaSDK GitHub
    - icon: fontawesome/brands/github
      link: https://github.com/Rinnegatamante/vitaGL
      name: vitaGL by Rinnegatamante
    - icon: fontawesome/brands/github
      link: https://github.com/TheOfficialFloW/kubridge
      name: kubridge by TheFloW

