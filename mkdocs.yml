site_name: PS Vita Porting Wiki & Knowledge Base
site_description: "The definitive technical manual and step-by-step knowledge base for porting Android games (.so loader, FalsoJNI, vitaGL) to PlayStation Vita."
site_author: "PS Vita Porting Community"
site_url: "https://metalsyntax.github.io/psvita-porting-wiki/"

repo_name: "MetalSyntax/psvita-porting-wiki"
repo_url: "https://github.com/MetalSyntax/psvita-porting-wiki"
edit_uri: "edit/main/docs/"

theme:
  name: material
  language: en
  palette:
    # Scheme mode: Dark / Light toggle
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  # Native Material for MkDocs Language Switcher dropdown in header
  alternate:
    - name: "🇬🇧 English (Default)"
      link: /psvita-porting-wiki/
      lang: en
    - name: "🇪🇸 Español"
      link: /psvita-porting-wiki/es/
      lang: es
    - name: "🇧🇷 Português"
      link: /psvita-porting-wiki/pt/
      lang: pt

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/vitasdk
      name: VitaSDK GitHub
    - icon: fontawesome/brands/github
      link: https://github.com/Rinnegatamante/vitaGL
      name: vitaGL by Rinnegatamante
    - icon: fontawesome/brands/github
      link: https://github.com/TheOfficialFloW/kubridge
      name: kubridge by TheFloW

# Clean, focused Navigation tree in English by default
nav:
  - "Overview": index.md
  - "Foundations":
      - "00. Hardware & Architecture": 00-fundamentals-architecture.md
      - "01. Environment & Toolchains": 01-environment-and-tools.md
      - "02. APK Triage & Viability": 02-apk-triage-and-selection.md
      - "03. Static Analysis & Reverse Eng": 03-static-analysis-and-reverse-engineering.md
  - "Loader Implementation":
      - "04. SoLoader Core & Relocations": 04-soloader-architecture-and-relocations.md
      - "05. FalsoJNI & Java Bridge": 05-falsojni-and-java-bridge.md
      - "06. Graphics Pipeline (vitaGL)": 06-vitagl-graphics-pipeline.md
      - "07. Audio Subsystem": 07-audio-subsystem.md
      - "08. Controls & Input Mapping": 08-controls-and-input.md
      - "09. File System & Assets": 09-file-system-and-assets.md
      - "10. LiveArea & VPK Packaging": 10-livearea-and-vpk-packaging.md
  - "Diagnostics & Engines":
      - "11. Crash Triage & Hardware Debug": 11-crash-triage-and-debugging.md
      - "12. Real Engine Archaeology": 12-engine-archaeology.md
      - "13. AI-Assisted Porting Guide": 13-ai-assisted-porting.md
      - "14. Base Guide (gl33ntwine)": 14-base-guide-gl33ntwine.md
      - "15. Quick Reference & Cheat Sheets": 15-quick-reference-and-cheatsheets.md
  - "Languages / Idiomas":
      - "🇪🇸 Español": es/index.md
      - "🇧🇷 Português": pt/index.md
