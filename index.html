<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>PS Vita Porting Wiki & Knowledge Base</title>
  <meta http-equiv="refresh" content="0; url=docs/index.html">
  <script type="text/javascript">
    // Automatic redirection based on browser language
    var userLang = navigator.language || navigator.userLanguage;
    if (userLang.startsWith('pt')) {
      window.location.href = "pt/";
    } else if (userLang.startsWith('es')) {
      window.location.href = "es/";
    } else {
      window.location.href = "en/";
    }
  </script>
</head>
<body>
  <p>Redirigiendo a la wiki / Redirecting to wiki / Redirecionando para a wiki... <br>
     <a href="es/">Español</a> | <a href="en/">English</a> | <a href="pt/">Português</a>
  </p>
</body>
</html>
